# 本地自备 PostgreSQL / Redis 的启动编排。
# 与 docker-compose.yml 的区别：不启动 postgres、redis，app 直连宿主机上已有的实例。
# 完整使用说明（构建 / 启动 / 重启 / 日志 / 排障）见 docker-compose.local.md。
#
# 用法：
#   docker compose -f docker-compose.local.yml up -d
#   docker compose -f docker-compose.local.yml ps
#   docker compose -f docker-compose.local.yml logs -f app
#   docker compose -f docker-compose.local.yml down
#
# 连接参数：账号密码直接复用 .env 的 DB_USER / DB_PASSWORD / DB_NAME / REDIS_PASSWORD；
# 仅网络地址需要覆盖（容器里不能用 127.0.0.1）：
#   LOCAL_DB_HOST（默认 host.docker.internal）、LOCAL_DB_PORT（默认取 .env 的 DB_PORT，再退回 5432）
#   LOCAL_REDIS_ADDR（默认 host.docker.internal:6379）
# 端口直接改 .env 的 DB_PORT 即可；需要临时覆盖时：
#   LOCAL_DB_PORT=5433 docker compose -f docker-compose.local.yml up -d
#
# 注意：
# 1. 本机的 PostgreSQL 必须已安装并可创建以下扩展：
#    uuid-ossp、vector(pgvector)、pg_trgm、pg_search(ParadeDB)。
#    缺少 pg_search 时 AUTO_MIGRATE 会在 000002 迁移处失败，app 无法启动。
#    自检：SELECT name, default_version, installed_version
#          FROM pg_available_extensions
#          WHERE name IN ('uuid-ossp','vector','pg_trgm','pg_search');
# 2. PostgreSQL / Redis 必须监听容器可达的地址，不能只绑定 127.0.0.1。
#    Docker Desktop 下容器通过 host.docker.internal 访问宿主机。
# 3. 首次启动前按需在 .env 中填写 JWT_SECRET、SYSTEM_AES_KEY（本文件会读取 .env）。

name: weknora-local

services:
  docreader:
    image: wechatopenai/weknora-docreader:${WEKNORA_VERSION:-latest}
    expose:
      - "50051"
    volumes:
      - docreader-tmp:/tmp/docreader
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - DOCREADER_IMAGE_OUTPUT_DIR=/tmp/docreader
      - DOCREADER_GRPC_PORT=50051
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - weknora-local
    extra_hosts:
      - "host.docker.internal:host-gateway"

  app:
    image: wechatopenai/weknora-app:${WEKNORA_VERSION:-latest}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - data-files:/data/files
      - docreader-tmp:/tmp/docreader:ro
      - ./config/config.yaml:/app/config/config.yaml
    env_file:
      - .env
    environment:
      # 以下 8 项覆盖 .env 中指向 compose 内 postgres/redis 的值
      - DB_DRIVER=postgres
      - DB_HOST=${LOCAL_DB_HOST:-host.docker.internal}
      - DB_PORT=${LOCAL_DB_PORT:-${DB_PORT:-5432}}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=${DB_NAME:-WeKnora}
      - REDIS_ADDR=${LOCAL_REDIS_ADDR:-host.docker.internal:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # 其余运行时开关沿用 .env
      - DOCREADER_ADDR=docreader:50051
      - STREAM_MANAGER_TYPE=${STREAM_MANAGER_TYPE:-redis}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
      - RETRIEVE_DRIVER=${RETRIEVE_DRIVER:-postgres}
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - TZ=${TZ:-Asia/Shanghai}
      - GIN_MODE=${GIN_MODE:-release}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - WEKNORA_ASYNQ_CORE_CONCURRENCY=${WEKNORA_ASYNQ_CORE_CONCURRENCY:-8}
      - WEKNORA_ASYNQ_POSTPROCESS_CONCURRENCY=${WEKNORA_ASYNQ_POSTPROCESS_CONCURRENCY:-2}
      - WEKNORA_ASYNQ_ENRICHMENT_CONCURRENCY=${WEKNORA_ASYNQ_ENRICHMENT_CONCURRENCY:-12}
      - WEKNORA_ASYNQ_MAINTENANCE_CONCURRENCY=${WEKNORA_ASYNQ_MAINTENANCE_CONCURRENCY:-4}
      - WEKNORA_ASYNQ_SHARED_CONCURRENCY=${WEKNORA_ASYNQ_SHARED_CONCURRENCY:-6}
      - WEKNORA_WIKI_ASYNQ_CONCURRENCY=${WEKNORA_WIKI_ASYNQ_CONCURRENCY:-8}
      - WEKNORA_MODEL_MAX_CONCURRENCY=${WEKNORA_MODEL_MAX_CONCURRENCY:-32}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      docreader:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - weknora-local
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: wechatopenai/weknora-ui:${WEKNORA_VERSION:-latest}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - MAX_SKILL_BUNDLE_SIZE_MB=${MAX_SKILL_BUNDLE_SIZE_MB:-256}
      - DEFAULT_LOCALE=${DEFAULT_LOCALE:-}
      - APP_HOST=app
      - APP_PORT=8080
      - APP_SCHEME=http
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - weknora-local

networks:
  weknora-local:
    name: weknora-local

volumes:
  data-files:
  docreader-tmp:
